name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(grep -oP '^project\(QuickShareLinux VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [[ "$tag_version" != "$cmake_version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag_version}) does not match CMakeLists.txt (${cmake_version})"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check the Arch package version matches
        run: |
          pkgver="$(grep -oP '^pkgver=\K.*' packaging/arch/PKGBUILD)"
          if [[ "$pkgver" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::packaging/arch/PKGBUILD pkgver=${pkgver} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check the metainfo release matches
        run: |
          meta="$(grep -oP '<release version="\K[^"]+' packaging/top.suhasdissa.QuickShareLinux.metainfo.xml | head -n 1)"
          if [[ "$meta" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::metainfo release ${meta} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      # gh release create resolves the tag through git. The job otherwise only
      # has the downloaded artifacts, and gh exits with "not a git repository".
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cat > notes.md <<EOF
          First-party packages for QuickShareLinux ${VERSION}.

          ## Installing

          - **AppImage**: \`chmod +x QuickShareLinux-*.AppImage && ./QuickShareLinux-*.AppImage\`
          - **Arch Linux**: \`sudo pacman -U quickshare-linux-*.pkg.tar.zst\`
          - **Flatpak**: add Flathub if you do not already have it (\`flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo\`), then \`flatpak install --user QuickShareLinux-*.flatpak\`. The KDE 6.11 runtime comes from Flathub.
          EOF

      - name: Write SHA256SUMS
        run: |
          sha256sum \
            dist/appimage/*.AppImage \
            dist/arch/*.pkg.tar.zst \
            dist/flatpak/*.flatpak \
            | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/appimage/*.AppImage
            dist/arch/*.pkg.tar.zst
            dist/flatpak/*.flatpak
            SHA256SUMS
          )
          if compgen -G "dist/appimage/*.AppImage.zsync" > /dev/null; then
            files+=(dist/appimage/*.AppImage.zsync)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "QuickShareLinux ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${files[@]}"
